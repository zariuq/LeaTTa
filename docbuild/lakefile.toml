# Isolated package for generating API documentation with doc-gen4.
# It requires the main library by path and doc-gen4 pinned to the matching toolchain, and
# reuses the parent's already-fetched packages (Mathlib, etc.) via packagesDir. This keeps
# doc-gen4 out of the main build. Generate docs with:
#   cd docbuild && lake build MettaHyperonFull:docs Metatheory:docs Operational:docs MeTTaIL:docs MeTTaILProofs:docs CordialMiners:docs
# Output lands in docbuild/.lake/build/doc/.
name = "docbuild"
reservoir = false
version = "0.1.0"
defaultTargets = []
packagesDir = "../.lake/packages"

[[require]]
name = "MettaHyperonFull"
path = ".."

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "e2af49a7b7e5e1a9224008c1f15e7aa4f58a4015"
